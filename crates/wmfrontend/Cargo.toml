[package]
name = "wmfrontend"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
web-sys = { version = "0.3.91", features = ["Document", "Element", "HtmlCanvasElement", "Response", "Window"] }
wmplatform = { path = "../wmplatform" }
wmresource = { path = "../wmresource" }
wmruntime = { path = "../wmruntime" }
wmtoolchain = { path = "../wmtoolchain" }
wmvm = { path = "../wmvm" }
wmui = { path = "../wmui" }
